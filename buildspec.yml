version: 0.2

env:
  parameter-store:
    DOCKERHUB_USER: /dockerhub/username
    DOCKERHUB_PASS: /dockerhub/password

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - echo $DOCKERHUB_PASS | docker login -u $DOCKERHUB_USER --password-stdin
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t amankainth/react-calculator:latest .
      - docker tag amankainth/react-calculator:latest amankainth/react-calculator:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push amankainth/react-calculator:latest
      - docker push amankainth/react-calculator:$IMAGE_TAG
      - echo Writing image definitions file...
      - printf '[{"name":"react-app","imageUri":"amankainth/react-calculator:%s"}]' $IMAGE_TAG > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
